# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jayakumaran R Portfolio
email: jaykumaran2217@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Hi, I'm Jayakumaran, a Deep Learning and Computer vision Enthusiast.
# twitter_username: Tamizh17Ar # Using full URL in author.links and footer.links instead
github_username: Jaykumaran # Your GitHub username
minimal_mistakes_skin: default # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
search: true

# Site Base URL settings - VERY IMPORTANT for GitHub Pages
url: "https://Jaykumaran.github.io" # Replace Jaykumaran with your GitHub username if different
baseurl: "" # For a user/organization site (username.github.io), this is an empty string or /
repository: Jaykumaran/Jaykumaran.github.io # Replace Jaykumaran with your GitHub username if different

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones (e.g. America/New_York)

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Jayakumaran R"
  avatar : "/assets/images/bio_photo_avatar.jpg" # IMPORTANT: Upload your photo here or change the path
  bio    : "Deep Learning and Computer Vision Enthusiast. Welcome to my portfolio!" # A short bio for the sidebar
  links:
    - label: "Email" # Optional
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jaykumaran2217@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jayakumaran-r17/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jaykumaran"
    - label: "X (Twitter)" # Changed from Twitter to X, or you can keep "Twitter"
      icon: "fab fa-fw fa-x-twitter" # Font Awesome icon for X, or use "fab fa-fw fa-twitter-square" for old logo
      url: "https://x.com/Tamizh17Ar"
    - label: "Resume"
      icon: "fas fa-fw fa-file-pdf"
      url: "https://drive.google.com/file/d/1r6E3PKydQ3kK_9CXl6WCTPY3yNvg6lic/view"


footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jayakumaran-r17/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jaykumaran"
    - label: "X (Twitter)"
      icon: "fab fa-fw fa-x-twitter" # Or "fab fa-fw fa-twitter-square"
      url: "https://x.com/Tamizh17Ar"
    - label: "Resume"
      icon: "fas fa-fw fa-file-pdf"
      url: "https://drive.google.com/file/d/1r6E3PKydQ3kK_9CXl6WCTPY3yNvg6lic/view"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true # Show author profile sidebar on posts
      read_time: true
      comments: true # Enable comments on posts
      share: true # Show social share buttons
      related: true # Show related posts
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single # Default layout for pages
      author_profile: true # Show author profile sidebar on pages

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
